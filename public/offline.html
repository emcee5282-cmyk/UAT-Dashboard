<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; background: #fff; color: #111827; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #f3f4f6; } }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; margin: 0 0 20px; opacity: .7; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 12px; border: 1px solid #d1d5db; background: transparent; color: inherit; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
